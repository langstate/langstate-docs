name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  mintlify:
    name: Mintlify and route checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:validate
      - run: pnpm docs:links
      - run: pnpm docs:a11y
      - run: pnpm docs:structure
      - run: git diff --check

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Check pushed whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}"

  pinned-source:
    name: Pinned implementation smoke tests
    needs: mintlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Verify source baseline and documentation examples
        run: bash scripts/smoke-pinned-source.sh
